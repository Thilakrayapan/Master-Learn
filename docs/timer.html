<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="PeakPulse — Gamified productivity tracker with tasks, study timer, and funny punishments.">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PeakPulse — Study Timer</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- ─── Navigation ────────────────────────────────────────────── -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-container">
      <a href="/" class="nav-brand" id="nav-brand">
        <span class="brand-icon">⚡</span>
        <span>PeakPulse</span>
      </a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-links" id="nav-links" role="menu">
        <a href="/"
           class="nav-link "
           role="menuitem" id="nav-tasks">
          <span class="nav-icon">🎯</span> Tasks
        </a>
        <a href="/timer"
           class="nav-link active"
           role="menuitem" id="nav-timer">
          <span class="nav-icon">⏱️</span> Timer
        </a>
        <a href="/dashboard"
           class="nav-link "
           role="menuitem" id="nav-dashboard">
          <span class="nav-icon">📊</span> Dashboard
        </a>
      </div>
    </div>
  </nav>

  <!-- Mobile Nav Overlay -->
  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- ─── Flash Messages ────────────────────────────────────────── -->
  
    
  

  <!-- ─── Main Content ──────────────────────────────────────────── -->
  <main class="main-content" id="main-content">
    
<div class="page-header">
  <h1>⏱️ Study Timer</h1>
  <p class="page-subtitle">Focus. Study. Conquer.</p>
</div>

<div class="timer-container" id="timer-container">
  <!-- Timer Display -->
  <div class="timer-display" id="timer-display">
    <div class="timer-glow"></div>
    <div class="timer-ring"></div>
    <div class="timer-ring-progress" id="timer-ring-progress"></div>
    <span class="timer-time" id="timer-time">25:00</span>
  </div>

  <!-- Preset Buttons -->
  <div class="timer-presets" id="timer-presets">
    <button class="preset-btn" data-minutes="15" id="preset-15">15 min</button>
    <button class="preset-btn active" data-minutes="25" id="preset-25">25 min</button>
    <button class="preset-btn" data-minutes="45" id="preset-45">45 min</button>
    <button class="preset-btn" data-minutes="60" id="preset-60">60 min</button>
    <button class="preset-btn" data-minutes="90" id="preset-90">90 min</button>
  </div>

  <!-- Controls -->
  <div class="timer-controls" id="timer-controls">
    <button class="timer-btn timer-btn-start" id="timer-start">
      ▶️ Start
    </button>
    <button class="timer-btn timer-btn-pause" id="timer-pause" style="display:none;">
      ⏸️ Pause
    </button>
    <button class="timer-btn timer-btn-reset" id="timer-reset">
      🔄 Reset
    </button>
  </div>

  <!-- Task Selector -->
  <div class="timer-task-select">
    <label for="timer-task">Link to Task (optional)</label>
    <select id="timer-task" name="task_id">
      <option value="">— Free Study —</option>
      
    </select>
  </div>

  <!-- Today's Stats -->
  <div class="timer-today-stats" id="timer-today-stats">
    <div class="stat-label">Today's Total Study Time</div>
    <div class="stat-value" id="today-total">
      
      
      0m
    </div>
  </div>
</div>

  </main>

  <!-- ─── Footer ────────────────────────────────────────────────── -->
  <footer class="footer">
    Built with <span>❤️</span> by PeakPulse &mdash; Stay productive or get punished! 😂
  </footer>

  <!-- ─── Navigation Script ─────────────────────────────────────── -->
  <script>
    // Hamburger menu toggle
    const navToggle = document.getElementById('nav-toggle');
    const navLinks = document.getElementById('nav-links');
    const navOverlay = document.getElementById('nav-overlay');

    function toggleNav() {
      const isOpen = navLinks.classList.toggle('open');
      navToggle.classList.toggle('active');
      navOverlay.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }

    navToggle.addEventListener('click', toggleNav);
    navOverlay.addEventListener('click', toggleNav);

    // Close nav when a link is clicked (mobile)
    navLinks.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (navLinks.classList.contains('open')) {
          toggleNav();
        }
      });
    });

    // Auto-remove flash messages
    setTimeout(() => {
      const fc = document.getElementById('flash-container');
      if (fc) fc.remove();
    }, 4000);
  </script>

  
<script src="/static/js/timer.js"></script>

</body>
</html>
